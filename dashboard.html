<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helper Dashboard | AmarElder</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-body">

    <div class="dash-layout">

        <aside class="sidebar">

            <a href="../index.html" class="logo">AmarElder</a>

            <p>Helper Panel</p>

            <nav>
                <a href="#overview" class="side-link active">Overview</a>
                <a href="#available" class="side-link">Available Requests</a>
                <a href="#accepted" class="side-link">My Accepted Requests</a>
                <a href="#profile" class="side-link">My Profile</a>
                <a href="#notifications" class="side-link">Notifications</a>
            </nav>

            <button class="btn" onclick="logout()">Logout</button>

        </aside>

        <main class="dash-main">

            <div class="dash-top" id="overview">

                <div>
                    <p class="muted">Helper Dashboard</p>
                    <h1 id="welcome">Welcome!</h1>
                </div>

                <span class="tag">Volunteer community</span>

            </div>

            <div class="stats">

                <div class="stat-card">
                    <strong id="available-count">0</strong>
                    <span>Available Requests</span>
                </div>

                <div class="stat-card">
                    <strong id="accepted-count">0</strong>
                    <span>Accepted</span>
                </div>

                <div class="stat-card">
                    <strong id="completed-count">0</strong>
                    <span>Completed by Me</span>
                </div>

                <div class="stat-card">
                    <strong id="total-count">0</strong>
                    <span>My Total Tasks</span>
                </div>

            </div>

            <section class="panel" id="available">

                <h2>Available Help Requests</h2>

                <div id="available-list" class="request-list"></div>

            </section>

            <section class="panel" id="accepted">

                <h2>My Accepted Requests</h2>

                <div id="accepted-list" class="request-list"></div>

            </section>

            <section class="panel" id="profile">

                <h2>My Profile</h2>

                <form id="profile-form" class="profile-grid">

                    <label>
                        Full Name
                        <input type="text" id="profile-name" disabled>
                    </label>

                    <label>
                        Email
                        <input type="email" id="profile-email" disabled>
                    </label>

                    <label>
                        Phone
                        <input type="text" id="profile-phone" placeholder="Phone number">
                    </label>

                    <label>
                        Address
                        <input type="text" id="profile-address" placeholder="Your address">
                    </label>

                    <label class="full">
                        Skills / Availability
                        <textarea id="profile-skills" rows="2"
                            placeholder="Example: shopping help, weekends"></textarea>
                    </label>

                    <div class="full">
                        <button type="submit" class="btn">Save Profile</button>
                    </div>

                </form>

            </section>

            <section class="panel" id="notifications">

                <h2>Notifications</h2>

                <div id="notification-list"></div>

            </section>

        </main>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
