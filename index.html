<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmarElder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <h1 class="logo" onclick="showHome()">AmarElder</h1>

        <div>
            <button class="btn-outline" onclick="openAuth('login')">Login</button>
            <button class="btn" onclick="openAuth('signup')">Sign Up</button>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h2>Together for a Safer & Happier Tomorrow</h2>

            <p>
                AmarElder connects elderly people with trusted caregivers
                and kind community members to ensure help, care and companionship.
            </p>

            <button class="btn" onclick="openAuth('signup')">
                Get Started
            </button>
        </div>

        <div class="hero-image">
            <img src="c:\Users\Lily\OneDrive\Pictures\images.jpg" alt="Elderly Care">

        </div>
    </main>

    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">

            <button class="close-btn" onclick="closeAuth()">×</button>

            <h2 id="modal-title">Login</h2>

            <form onsubmit="handleAuth(event)">

                <div id="role-div" class="hidden">
                    <label>Select Role</label>
                    <select id="role">
                        <option value="Elder">Elder</option>
                        <option value="Helper">Helper / Caregiver</option>
                    </select>
                </div>

                <input type="text" id="name" placeholder="Full Name" class="hidden">

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="password" id="password" placeholder="Password" required>

                <button type="submit" class="btn full-width" id="submit-btn">
                    Login
                </button>

            </form>

            <p id="auth-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
